<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display 6c</title>

    <style>
    .bloco1 {
        background-color: red;
        top: 0;
        left: 0;
    }

    .bloco2 {
        background-color: yellow;
        top: 0; 
        right: 0;
    }

    .bloco3 {
        background-color: blue;
        bottom: 0;
        left: 0;
    }

    .bloco4 {
        background-color: green;
        bottom: 0;
        right: 0;
    }

    .bloco5 {
    background-color: rgb(204, 6, 222);
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
}

    .bloco1, .bloco2, .bloco3, .bloco4, .bloco5 {
        width: 80px;
        height: 40px;
        text-align: center;
        position: fixed;
    }
    </style>

</head>
<body>
    
    <div class="bloco1">1</div>
    <div class="bloco2">2</div>
    <div class="bloco3">3</div>
    <div class="bloco4">4</div>
    <div class="bloco5">5</div>

</body>
</html>
